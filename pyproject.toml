[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorly"
version = "0.1.0.dev0"
description = "Mirrorly - A simple and safe folder mirror backup assistant for Windows"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mirrorly Developers" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

# 运行时依赖。添加依赖时必须同时更新 environment.yml，保持两者一致。
# blake3：完整性哈希主算法（ADR-013），有官方 Windows wheel；
#         不可用时代码自动降级 hashlib.sha256 并在报告中明示。
dependencies = [
    "blake3>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mirrorly = "mirrorly.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

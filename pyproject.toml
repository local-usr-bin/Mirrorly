[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrorly"
version = "0.0.1"
description = "Mirrorly - Personal backup and synchronization tool"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Mirrorly Developers" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3.12",
    "Private :: Do Not Upload",
]

# 依赖项：当前为初始化阶段，产品功能尚未实现，暂无运行时依赖。
# 后续添加依赖时必须同时更新 environment.yml，保持两者一致。

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
mirrorly = "mirrorly.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
